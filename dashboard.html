<!DOCTYPE html>
<html lang="en-ZA">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard | Student Market Place</title>
  <meta name="description" content="Your Student Market Place dashboard: listings, purchases, messages and reviews.">
  <meta name="theme-color" content="#082744">
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="assets/images/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/app.js" defer></script>
  <script src="js/services.js" defer></script>
  <script src="js/dashboard.js" defer></script>
</head>
<body data-page="dashboard" data-auth="required">
  <div id="app-header"></div>
  <main id="main" class="container page">
    <div class="dash-layout">
      <aside class="card dash-sidebar" aria-label="Dashboard navigation">
        <div class="dash-user" id="dash-user"></div>
        <nav class="dash-nav" id="dash-nav"></nav>
      </aside>
      <div id="dash-view" class="stack" tabindex="-1"></div>
    </div>
  </main>
  <div id="app-footer"></div>
</body>
</html>
